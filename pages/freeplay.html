<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Free Play - CourtFindr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet">
    <link rel="stylesheet"
          href="../style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">
    <img src="../images/courtfindr-logo.png" alt="CourtFindr">
</div>

        <nav>

            <a href="../index.html">
                Home
            </a>

            <a href="find-court.html">
                Find a Court
            </a>

            <a href="freeplay.html"
               class="active">
                FreePlay
            </a>

            <a href="facilities.html">
    Facilities
</a>

        </nav>

        <div class="auth-buttons">

    <button
        class="login-btn"
        onclick="window.location.href='login.html'">
        Log In
    </button>

    <button
        class="signup-btn"
        onclick="window.location.href='signup.html'">
        Sign Up
    </button>

</div>

    </header>


    <main class="freeplay-page">

    <section class="freeplay-hero">

    <div class="freeplay-hero-content">

        <h1>Free Play</h1>

        <p>
            Find games and play with people near you.
        </p>

    </div>

</section>


    <section class="game-search">

        <div class="search-field">

            <label>Sport</label>

            <select id="freeplay-sport">

                <option>All Sports</option>
                <option>Basketball</option>
                <option>Pickleball</option>
                <option>Tennis</option>
                <option>Volleyball</option>
                <option>Badminton</option>

            </select>

        </div>


        <div class="search-field">

            <label>Date</label>

            <input
                type="date"
                id="freeplay-date"
            >

        </div>


        <div class="search-field">

            <label>Time</label>

            <input
                type="time"
                id="freeplay-time"
            >

        </div>


        <div class="search-field">

            <label>Location</label>

            <div class="location-search">

    <input
        type="text"
        id="freeplay-location"
        placeholder="Enter location"
        autocomplete="off"
    >

    <div
        id="freeplay-suggestions"
        class="location-suggestions">
    </div>

</div>

        </div>


        <button
            class="find-games-btn"
            onclick="findGames()">

            Find Games

        </button>

        <button
            class="find-games-btn"
            onclick="window.location.href='freeplay-games.html'">

            Browse Available Games

        </button>

        <button
            class="find-games-btn"
            onclick="window.location.href='create-freeplay.html'">

            Create FreePlay

        </button>

    </section>


    <section class="quick-filters">

        <h2>Quick Filters</h2>

        <div class="filter-buttons">

            <button
    type="button"
    class="filter active"
    onclick="selectLevel('All', this)">
    All
</button>

<button
    type="button"
    class="filter"
    onclick="selectLevel('Beginner', this)">
    Beginner
</button>

<button
    type="button"
    class="filter"
    onclick="selectLevel('Intermediate', this)">
    Intermediate
</button>

<button
    type="button"
    class="filter"
    onclick="selectLevel('Advanced', this)">
    Advanced
</button>

        </div>

    </section>

</main>
<script>
let selectedLevel = "All";
function findGames() {

    const sport =
        document.getElementById("freeplay-sport").value;

    const location =
        document.getElementById("freeplay-location").value.trim();

    const date =
        document.getElementById("freeplay-date").value;

    const time =
        document.getElementById("freeplay-time").value;

    const level = selectedLevel;


    const params = new URLSearchParams();

    params.set("sport", sport);
    params.set("location", location);
    params.set("date", date);
    params.set("time", time);
    params.set("level", level);


    window.location.href =
        "freeplay-games.html?" + params.toString();

}
function selectLevel(level, button) {

    selectedLevel = level;

    const buttons =
        document.querySelectorAll(".filter");

    buttons.forEach(function(btn) {

        btn.classList.remove("active");

    });

    button.classList.add("active");

}
const freeplayLocationInput =
    document.getElementById("freeplay-location");

const freeplaySuggestions =
    document.getElementById("freeplay-suggestions");


const locations = [

    "Santa Rosa, Laguna",
    "Santa Cruz, Laguna",
    "Calamba, Laguna",
    "Biñan, Laguna",
    "Cabuyao, Laguna",
    "San Pedro, Laguna",
    "Los Baños, Laguna",
    "Bay, Laguna",
    "Pansol, Calamba, Laguna",
    "Nuvali, Santa Rosa, Laguna",

    "Makati, Metro Manila",
    "Taguig, Metro Manila",
    "Pasig, Metro Manila",
    "Quezon City, Metro Manila",
    "Manila, Metro Manila",

    "Alabang, Muntinlupa",
    "Bacoor, Cavite",
    "Dasmariñas, Cavite",
    "Imus, Cavite",

    "Antipolo, Rizal",
    "Marikina, Metro Manila"

];


freeplayLocationInput.addEventListener(
    "input",
    function() {

        const query =
            this.value.trim().toLowerCase();

        freeplaySuggestions.innerHTML = "";

        if (query.length < 2) {

            freeplaySuggestions.style.display =
                "none";

            return;
        }


        const matches =
            locations.filter(function(location) {

                return location
                    .toLowerCase()
                    .includes(query);

            });


        if (matches.length === 0) {

            freeplaySuggestions.innerHTML = `
                <div class="location-suggestion">
                    No matching locations
                </div>
            `;

            freeplaySuggestions.style.display =
                "block";

            return;
        }


        matches.forEach(function(location) {

            const suggestion =
                document.createElement("div");

            suggestion.className =
                "location-suggestion";

            suggestion.textContent =
                "📍 " + location;


            suggestion.addEventListener(
                "click",
                function() {

                    freeplayLocationInput.value =
                        location;

                    freeplaySuggestions.innerHTML =
                        "";

                    freeplaySuggestions.style.display =
                        "none";

                }
            );


            freeplaySuggestions.appendChild(
                suggestion
            );

        });


        freeplaySuggestions.style.display =
            "block";

    }
);
function createFreePlay() {

    alert("Create Free Play is available for Play+ members only.");

}
</script>
<script src="../auth.js"></script>
</body>

</html>
